version: 2

models:
  - name: stg_orders
    description: Cleaned order records used by downstream marts.
    columns:
      - name: order_id
        description: Primary key of the order batch.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: amount_usd
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'VND']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'completed', 'refunded', 'cancelled']
      - name: order_date
        data_tests:
          - not_null

  - name: stg_customers
    description: Customer dimension with SCD-style validity windows.
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: is_active
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
