dataset: orders
owner: commerce-data
description: Order batch landing in the warehouse; feeds stg_orders -> fct_daily_revenue -> CEO dashboard.
consumers: [fct_daily_revenue, ceo_revenue_dashboard]
runbook: docs/SOLUTION.md#runbook
freshness:
  column: updated_at
  max_delay_minutes: 30
  severity: warning
columns:
  order_id:
    type: integer
    required: true
    unique: true
    severity: critical
  customer_id:
    type: string
    required: true
    severity: critical
  amount:
    type: number
    required: true
    min: 0
    severity: critical
  currency:
    type: string
    required: true
    accepted_values: [USD, VND]
    severity: critical
  status:
    type: string
    required: true
    accepted_values: [pending, completed, refunded, cancelled]
    severity: warning
  created_at:
    type: datetime
    required: true
    severity: critical
  updated_at:
    type: datetime
    required: true
    severity: critical

# Cross-field business assertions. `expr` describes the condition a VALID row
# must satisfy; violating rows are quarantined (severity: warning).
row_rules:
  - name: created_before_updated
    expr: "created_at <= updated_at"
    datetime_columns: [created_at, updated_at]
    severity: warning

# NOTE: deliberately no `row_count` floor here. Volume collapse must be caught
# by the anomaly detector (Phase 3), not by a hand-written threshold that
# nobody maintains.
