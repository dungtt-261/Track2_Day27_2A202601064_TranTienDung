# Local Marquez stack for the Lab 27 OpenLineage exercise.
#   docker compose -f marquez/docker-compose.yml up -d
#   API  -> http://localhost:5000   (POST /api/v1/lineage)
#   UI   -> http://localhost:3000
#   docker compose -f marquez/docker-compose.yml down -v
services:
  marquez-db:
    image: postgres:14
    container_name: lab27-marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 5s
      retries: 20

  marquez-api:
    image: marquezproject/marquez:0.51.1
    container_name: lab27-marquez-api
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./marquez.yml:/opt/marquez/marquez.yml:ro
    entrypoint: ["/usr/src/app/entrypoint.sh"]

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: lab27-marquez-web
    depends_on: [marquez-api]
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "3000:3000"
